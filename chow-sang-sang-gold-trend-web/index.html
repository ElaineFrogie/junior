<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="香港与中国大陆周生生足金饰品每日价格、走势及价差比较">
  <title>周生生两地金价观察</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="page">
    <header class="hero">
      <div><p class="kicker">Gold price monitor</p><h1>周生生两地<br>金价观察</h1><p class="updated"><span class="live-dot"></span>最后数据更新：<time id="updated">加载中</time></p></div>
      <div class="hero-metric"><span>最新两地价差</span><strong id="latest-gap">--</strong></div>
    </header>
    <div class="legend" aria-label="图例"><button type="button" data-series="hk" aria-pressed="true"><i class="swatch hk"></i>香港折算价</button><button type="button" data-series="cn" aria-pressed="true"><i class="swatch cn"></i>大陆挂牌价</button></div>
    <div id="error" class="error" hidden></div>
    <section class="analysis"><div class="chart-wrap"><h2>挂牌价水平</h2><p class="sub">统一换算为人民币/克</p><svg id="price-chart" class="skeleton" role="img" aria-label="两地足金饰品每日挂牌价"></svg></div><aside class="insight"><span class="insight-label">最新观察</span><strong id="price-title">读取数据中</strong><p id="price-copy"></p></aside></section>
    <section class="analysis"><div class="chart-wrap"><h2>相对走势</h2><p class="sub">区间首个共同报价日 = 100</p><svg id="index-chart" class="skeleton" role="img" aria-label="两地金价相对走势"></svg></div><aside class="insight"><span class="insight-label">区间走势</span><strong id="trend-title">读取数据中</strong><p id="trend-copy"></p></aside></section>
    <section class="analysis"><div class="chart-wrap"><h2>两地价差</h2><p class="sub">大陆挂牌价 − 香港折算价</p><svg id="gap-chart" class="skeleton" role="img" aria-label="两地每日价差"></svg></div><aside class="insight"><span class="insight-label">价差变化</span><strong id="gap-title">读取数据中</strong><p id="gap-copy"></p></aside></section>
    <p class="footnote">香港价格按港币/两 ÷ 37.5 × 当期港币兑人民币汇率折算；香港报价含2%佣金，大陆报价不含工费。自动采集数据仅供研究，实际交易以品牌官方或门店报价为准。</p>
  </main>
  <div id="tooltip" class="tooltip" role="tooltip"></div>
  <script src="site.js"></script>
</body>
</html>
